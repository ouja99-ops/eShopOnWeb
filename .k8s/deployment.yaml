apiversion: V1
kind: Namespace
mmetadata:
  name: eshoponewb-ou
  

apiVersion: apps/v1
kind: Deployment
metadata:
namespace: eshoponewb-ou
  name: webapp
  labels:
    app: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      service: webapp
  template:
    metadata:
      labels:
        app: sample-app
        service: webapp
    spec:
      containers:
        - name: webapp
        #image: acrnm02test.azurecr.io/webapp:v1
          image: eshoponweb-user011webapp
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: http://+:80
            - name: WebApiBaseAddress
              value: http://webapi
              
